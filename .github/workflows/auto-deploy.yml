name: Deploy Backend Spring Boot

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Build e Push para o Registry Local
        run: |
          docker build -t localhost:5000/backend-transparencia:latest .
          docker push localhost:5000/backend-transparencia:latest

      - name: Recriar Container do Back-end
        run: |
          docker rm -f backend_transparencia || true