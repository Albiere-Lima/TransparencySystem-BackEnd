services:
  db:
    image: postgres:15
    container_name: db_transparenciaCA
    environment:
      POSTGRES_DB: transparencia_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
    ports:
      - "5432:5432"

  backend:
    build: .
    container_name: backend_transparencia
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/transparencia_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin_password